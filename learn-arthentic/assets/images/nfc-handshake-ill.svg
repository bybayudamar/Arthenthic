<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#E11D2E" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Canvas Texture Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>

    <!-- Painting Gradient (Abstract Art Relief) -->
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#E11D2E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Copper Coil Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Smartphone Body Gradient -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseWave {
      0% { r: 18px; opacity: 0.9; stroke-width: 2.5; }
      50% { r: 52px; opacity: 0.4; stroke-width: 1.8; }
      100% { r: 86px; opacity: 0; stroke-width: 0.8; }
    }
    @keyframes floatPhone {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanRay {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(80px); opacity: 0.2; }
    }
    .wave-pulse-1 { animation: pulseWave 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .wave-pulse-2 { animation: pulseWave 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 0.9s; }
    .wave-pulse-3 { animation: pulseWave 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.8s; }
    .floating-phone { animation: floatPhone 4s ease-in-out infinite; }
    .scan-line { animation: scanRay 2.4s linear infinite; }
  </style>

  <!-- Ambient Backdrop Grid -->
  <rect x="10" y="10" width="440" height="320" rx="20" fill="url(#bgGrad)"/>
  <circle cx="160" cy="180" r="120" fill="#E11D2E" fill-opacity="0.03"/>
  <circle cx="330" cy="140" r="90" fill="#10B981" fill-opacity="0.03"/>

  <!-- ========================================== -->
  <!-- 1. PHYSICAL CANVAS ARTWORK (LEFT/BACKGROUND) -->
  <!-- ========================================== -->
  <g id="canvasArtwork" filter="url(#shadowFilter)">
    <!-- Canvas Frame Stretcher Shadow & Edge -->
    <rect x="36" y="44" width="220" height="248" rx="10" fill="#D8D3C5"/>
    <rect x="38" y="46" width="216" height="244" rx="8" fill="url(#canvasGrad)"/>

    <!-- Fine Linen Canvas Texture Grid (Micro-Weave Simulation) -->
    <g opacity="0.12" stroke="#475569" stroke-width="0.5">
      <line x1="38" y1="70" x2="254" y2="70"/>
      <line x1="38" y1="95" x2="254" y2="95"/>
      <line x1="38" y1="120" x2="254" y2="120"/>
      <line x1="38" y1="145" x2="254" y2="145"/>
      <line x1="38" y1="170" x2="254" y2="170"/>
      <line x1="38" y1="195" x2="254" y2="195"/>
      <line x1="38" y1="220" x2="254" y2="220"/>
      <line x1="38" y1="245" x2="254" y2="245"/>
      <line x1="38" y1="270" x2="254" y2="270"/>

      <line x1="65" y1="46" x2="65" y2="290"/>
      <line x1="95" y1="46" x2="95" y2="290"/>
      <line x1="125" y1="46" x2="125" y2="290"/>
      <line x1="155" y1="46" x2="155" y2="290"/>
      <line x1="185" y1="46" x2="185" y2="290"/>
      <line x1="215" y1="46" x2="215" y2="290"/>
      <line x1="245" y1="46" x2="245" y2="290"/>
    </g>

    <!-- Painted Abstract Impasto Strokes -->
    <path d="M46 60 Q90 50 140 85 T220 100 T246 70 L246 210 Q190 230 140 200 T50 220 Z" fill="url(#artGrad)" opacity="0.92"/>
    <path d="M70 120 Q110 95 170 140 T246 170 L246 240 Q160 260 80 230 Z" fill="#F43F5E" opacity="0.35"/>
    <path d="M50 180 Q100 150 150 190 T240 210 L240 280 Q140 290 50 270 Z" fill="#E11D2E" opacity="0.45"/>

    <!-- Canvas Label Tag -->
    <rect x="48" y="56" width="76" height="20" rx="4" fill="#0F172A" fill-opacity="0.75"/>
    <text x="54" y="70" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">CANVAS #101</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. EMBEDDED NXP NTAG 424 DNA NFC TAG       -->
  <!-- ========================================== -->
  <g id="nfcTagLocation">
    <!-- Tamper Evident Loop Wire (Conductive silver trace around border) -->
    <path d="M160 180 L234 180 L234 274 L54 274 L54 180 Z" 
          stroke="#10B981" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.85"/>
    <rect x="58" y="258" width="86" height="15" rx="3" fill="#10B981" fill-opacity="0.15"/>
    <text x="62" y="269" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">TAMPER: INTACT</text>

    <!-- NFC Tag Base Disk -->
    <circle cx="160" cy="180" r="32" fill="#FFFFFF" filter="url(#shadowFilter)"/>
    <circle cx="160" cy="180" r="30" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Concentric RF Antenna Coils (Copper Micro-Trace) -->
    <circle cx="160" cy="180" r="25" fill="none" stroke="url(#copperGrad)" stroke-width="1.2"/>
    <circle cx="160" cy="180" r="21" fill="none" stroke="url(#copperGrad)" stroke-width="1.2"/>
    <circle cx="160" cy="180" r="17" fill="none" stroke="url(#copperGrad)" stroke-width="1.2"/>
    <circle cx="160" cy="180" r="13" fill="none" stroke="url(#copperGrad)" stroke-width="1.2"/>

    <!-- Microchip Center -->
    <rect x="151" y="171" width="18" height="18" rx="3" fill="#0F172A"/>
    <circle cx="160" cy="180" r="4" fill="#E11D2E"/>
    <circle cx="160" cy="180" r="2" fill="#FFFFFF"/>

    <!-- Tag Specification Overlay Pill -->
    <rect x="110" y="218" width="100" height="20" rx="10" fill="#0F172A" filter="url(#shadowFilter)"/>
    <circle cx="120" cy="228" r="3" fill="#10B981"/>
    <text x="128" y="232" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">NXP NTAG 424</text>

    <!-- Dynamic Pulsing Radio Frequency Waves -->
    <circle cx="160" cy="180" r="28" fill="none" stroke="#E11D2E" class="wave-pulse-1" filter="url(#glowFilter)"/>
    <circle cx="160" cy="180" r="28" fill="none" stroke="#E11D2E" class="wave-pulse-2" filter="url(#glowFilter)"/>
    <circle cx="160" cy="180" r="28" fill="none" stroke="#E11D2E" class="wave-pulse-3" filter="url(#glowFilter)"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. SMARTPHONE DEVICE (RIGHT / HOVERING)    -->
  <!-- ========================================== -->
  <g id="smartPhoneGroup" class="floating-phone" filter="url(#shadowFilter)">
    <!-- Phone Outer Chassis -->
    <rect x="240" y="32" width="170" height="268" rx="28" fill="url(#phoneGrad)" stroke="#334155" stroke-width="2.5"/>

    <!-- Speaker / Dynamic Island Top Notch -->
    <rect x="295" y="42" width="60" height="10" rx="5" fill="#000000"/>
    <circle cx="344" cy="47" r="2" fill="#3B82F6"/>

    <!-- Phone Glass Screen -->
    <rect x="248" y="58" width="154" height="230" rx="20" fill="url(#screenGrad)"/>

    <!-- Screen UI Header -->
    <text x="262" y="76" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">ARTHENTIC PROTOCOL</text>
    <rect x="368" y="68" width="22" height="10" rx="5" fill="#10B981" fill-opacity="0.2"/>
    <text x="371" y="76" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700">LIVE</text>
    <line x1="258" y1="84" x2="392" y2="84" stroke="#1E293B" stroke-width="1"/>

    <!-- Screen Verification Card -->
    <rect x="256" y="92" width="138" height="120" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Shield Icon in Phone UI -->
    <circle cx="325" cy="118" r="16" fill="#E11D2E" fill-opacity="0.15"/>
    <path d="M325 108 L334 113 V121 C334 126 330 130 325 132 C320 130 316 126 316 121 V113 Z" 
          fill="#E11D2E" stroke="#E11D2E" stroke-width="1.5"/>
    <path d="M322 120 L324.5 122.5 L328.5 117" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="325" y="142" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">
      AUTHENTIC PIECE
    </text>
    <text x="325" y="152" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      SUN CMAC NONCE OK
    </text>

    <!-- Cryptographic Hash Telemetry Lines -->
    <rect x="264" y="160" width="122" height="14" rx="4" fill="#090D16"/>
    <text x="268" y="170" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="6.5">
      UID: 04A1B2C3D4E580
    </text>

    <rect x="264" y="178" width="122" height="14" rx="4" fill="#090D16"/>
    <text x="268" y="188" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="6.5">
      CMAC: 9F2CA871B04E
    </text>

    <!-- Bottom Action Button on Screen -->
    <rect x="256" y="222" width="138" height="24" rx="12" fill="#E11D2E"/>
    <text x="325" y="238" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">
      Inspect On-Chain CoA
    </text>

    <!-- Subtle Home Bar -->
    <rect x="290" y="278" width="70" height="4" rx="2" fill="#64748B"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. RF CONNECTION BEAM & DATA PARTICLES     -->
  <!-- ========================================== -->
  <!-- Radio frequency connection arc between NFC tag and Phone NFC sensor -->
  <path d="M185 170 Q215 130 250 115" fill="none" stroke="#E11D2E" stroke-width="2" stroke-dasharray="5 3" opacity="0.9"/>
  <circle cx="218" cy="140" r="3.5" fill="#E11D2E" filter="url(#glowFilter)"/>
  <circle cx="236" cy="125" r="2.5" fill="#F59E0B"/>

  <!-- Protocol Floating Pills -->
  <g transform="translate(195, 80)">
    <rect x="0" y="0" width="72" height="18" rx="9" fill="#FFFFFF" filter="url(#shadowFilter)"/>
    <circle cx="9" cy="9" r="3" fill="#10B981"/>
    <text x="16" y="12.5" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">AES-128</text>
  </g>

  <g transform="translate(140, 275)">
    <rect x="0" y="0" width="88" height="18" rx="9" fill="#0F172A" filter="url(#shadowFilter)"/>
    <circle cx="10" cy="9" r="3" fill="#3B82F6"/>
    <text x="18" y="12.5" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">BASE L2 SEPOLIA</text>
  </g>
</svg>

